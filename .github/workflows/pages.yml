# Publishes the Cobalt Game Hub client (game-hub/client) to GitHub Pages:
#   https://<owner>.github.io/<repo>/
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   GAME_SERVER_URL      wss:// address of the game server. Defaults to the Render server
#                        from render.yaml (wss://cobalt-hub-server.onrender.com); set it to
#                        `none` to build a site for offline play only.
#   PAGES_CUSTOM_DOMAIN  the custom domain set in Settings → Pages (e.g. cobalt-hub.js.org):
#                        the site is then built for the domain's root and ships a CNAME file.
#   SITE_URL             public address of the site, for canonical/Open Graph tags and the
#                        sitemap. Only needed when the default below is wrong (Pages host names
#                        are lower case, and workflow expressions can't lower-case the owner).
#   SERVICE_WORKER       `off` publishes a service worker that removes itself and the offline
#                        copy from every player's browser (kill switch). Default: on.
#   GOOGLE_SITE_VERIFICATION  the content value of Search Console's HTML-tag verification.
name: Publish website

on:
  push:
    branches: [main, claude/web-game-hub-multiplayer-vs7eqq]
    paths: ['game-hub/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-hub/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run
      - name: Build the client
        env:
          VITE_BASE: ${{ vars.PAGES_CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL || 'wss://cobalt-hub-server.onrender.com' }}
          VITE_SITE_URL: ${{ vars.SITE_URL || (vars.PAGES_CUSTOM_DOMAIN && format('https://{0}/', vars.PAGES_CUSTOM_DOMAIN)) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          VITE_SW: ${{ vars.SERVICE_WORKER || 'on' }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build -w client
      - name: Add the custom domain
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$DOMAIN" > client/dist/CNAME
      # Turns Pages on (source: GitHub Actions) if the token is allowed to; otherwise
      # enable it once in Settings → Pages and run this workflow again.
      - uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: game-hub/client/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
