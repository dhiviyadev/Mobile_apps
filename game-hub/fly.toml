# Fly.io config for the game server. Deploy from game-hub/:
#   fly launch --no-deploy --copy-config   (first time; pick an app name)
#   fly volumes create hub_data --size 1   (once, before the first deploy; see [mounts])
#   fly deploy
app = "cobalt-game-hub"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "2567"
  # Set to your client origin(s) in production, e.g. "https://cobalt-hub.pages.dev"
  ALLOWED_ORIGINS = "*"

# Saved Voxelvale worlds (DATA_DIR=/data, set in the Dockerfile) live on this volume so they
# survive deploys and restarts. Create it once with: fly volumes create hub_data --size 1
# A volume belongs to one machine, which suits this single-machine setup.
[mounts]
  source = "hub_data"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  # Rooms live in memory: keep one machine running so matches aren't cut off.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
