# Netlify: set "Base directory" to game-hub in the site settings (or deploy with
# `netlify deploy` from this folder). Set VITE_SERVER_URL in the site's environment.
[build]
  command = "npm ci --no-audit --no-fund && npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker, page and manifest: always revalidate so updates reach players.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
