<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us paint under notches; safe-area insets are applied in CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10162a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cobalt Hub" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Two original multiplayer 3D games in your browser, built for tablets." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Cobalt Game Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Shown by CSS only while a game is running on a touch device held in portrait. -->
    <div class="rotate-overlay" aria-hidden="true">
      <div class="rotate-phone"></div>
      <p>Rotate your device to landscape to play</p>
    </div>
    <noscript>This hub needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
