[project]
name = "nexus-core"
version = "0.1.0"
description = "NEXUS core service: local-first personal AI operating system backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "numpy>=1.26",
  # Document extraction for the knowledge base
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# Apple Silicon local speech recognition. Installs MLX (~100MB); opt-in.
voice-mlx = ["mlx-whisper>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nexus-core = "nexus_core.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus_core*"]

[tool.setuptools.package-data]
nexus_core = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
