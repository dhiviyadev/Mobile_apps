# Render Blueprint (https://render.com/docs/blueprint-spec) for the Cobalt Game Hub.
# New → Blueprint → pick this repository. Update VITE_SERVER_URL after the first deploy.
services:
  - type: web
    name: cobalt-hub-server
    runtime: docker
    rootDir: game-hub
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      # Saved Voxelvale worlds are written here.
      - key: DATA_DIR
        value: /data
      # No disk: keep worlds in memory so players are told they last until the next restart.
      # Delete this variable when you attach the disk below.
      - key: PERSIST_WORLDS
        value: "false"
    # Without a persistent disk, saved worlds survive rooms emptying but are lost on the
    # next deploy or restart. Render disks need a paid instance type; to keep worlds, uncomment:
    # disk:
    #   name: hub-data
    #   mountPath: /data
    #   sizeGB: 1

  - type: web
    name: cobalt-hub-client
    runtime: static
    rootDir: game-hub
    buildCommand: npm ci --no-audit --no-fund && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SERVER_URL
        value: wss://cobalt-hub-server.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
