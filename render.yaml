# Render Blueprint (https://render.com/docs/blueprint-spec) for the Cobalt Game Hub's
# game server, on Render's free plan. New → Blueprint → pick this repository (and the
# branch with game-hub/). The website itself is published on GitHub Pages
# (.github/workflows/pages.yml); point it at this server's wss:// address.
services:
  - type: web
    name: cobalt-hub-server
    runtime: docker
    # Free instances sleep after 15 minutes without traffic and take about a minute to wake.
    plan: free
    rootDir: game-hub
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      # Render's proxy appends the client address to X-Forwarded-For (and keeps whatever the
      # client sent to the left of it). The rate limit on reopening worlds by code trusts
      # only entries proxies appended: the rightmost 1 here. Never set it higher than the
      # number of proxies that really append, or clients can choose their own address.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Saved Voxelvale worlds are written here.
      - key: DATA_DIR
        value: /data
      # No disk: keep worlds in memory so players are told they last until the next restart
      # (up to MAX_MEMORY_WORLD_BYTES, 128 MB by default; the least recently saved go first).
      # Delete this variable when you attach the disk below.
      - key: PERSIST_WORLDS
        value: "false"
    # Without a persistent disk, saved worlds survive rooms emptying but are lost on the
    # next deploy or restart. Render disks need a paid instance type; to keep worlds, uncomment:
    # disk:
    #   name: hub-data
    #   mountPath: /data
    #   sizeGB: 1
