# Render Blueprint (https://render.com/docs/blueprint-spec) for the Cobalt Game Hub's
# game server, on Render's free plan. New → Blueprint → pick this repository (and the
# branch with game-hub/). The website itself is published on GitHub Pages
# (.github/workflows/pages.yml), which connects to wss://cobalt-hub-server.onrender.com.
services:
  - type: web
    name: cobalt-hub-server
    runtime: docker
    # Free instances sleep after 15 minutes without traffic and take about a minute to wake.
    plan: free
    rootDir: game-hub
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Redeploy only when the server's own inputs change: every redeploy restarts it and
    # drops the worlds it keeps in memory, and website or docs pushes don't need one.
    # Build filter paths are relative to the repository root, not rootDir.
    buildFilter:
      paths:
        - game-hub/server/**
        - game-hub/shared/**
        - game-hub/package.json
        - game-hub/package-lock.json
        - game-hub/tsconfig.base.json
        - game-hub/client/package.json
      ignoredPaths:
        - game-hub/server/test/**
        - game-hub/shared/test/**
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      # Render's proxies (Cloudflare, then Render's own) append to X-Forwarded-For and keep
      # whatever the client sent to the left. The rate limit on reopening worlds by code
      # trusts only the entries proxies appended: the client is 3 from the right on Render,
      # as reported by Render users (Render doesn't document it). The server logs
      # "X-Forwarded-For with N entries seen"; for browser traffic N should equal this
      # value. Never set it higher than that N, or clients can choose their own address.
      - key: TRUST_PROXY_HOPS
        value: "3"
      # Saved Voxelvale worlds are written here.
      - key: DATA_DIR
        value: /data
      # No disk: keep worlds in memory so players are told they last until the next restart
      # (up to MAX_MEMORY_WORLD_BYTES, 128 MB by default; the least recently saved go first).
      # Delete this variable when you attach the disk below.
      - key: PERSIST_WORLDS
        value: "false"
    # Without a persistent disk, saved worlds survive rooms emptying but are lost on the
    # next deploy or restart. Render disks need a paid instance type; to keep worlds, uncomment:
    # disk:
    #   name: hub-data
    #   mountPath: /data
    #   sizeGB: 1
